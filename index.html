<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Song Downloader</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0a0a0a;
      color: #eee;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2.5rem 1.2rem;
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
    }

    header h1 {
      font-size: clamp(1.6rem, 6vw, 2.4rem);
      font-weight: 700;
      background: linear-gradient(135deg, #1db954, #1ed760);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: .4rem;
    }

    header p {
      color: #555;
      font-size: .9rem;
    }

    .search-wrap {
      width: 100%;
      max-width: 580px;
    }

    .search-bar {
      display: flex;
      gap: .5rem;
      background: #161616;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      padding: .4rem .4rem .4rem 1rem;
      transition: border-color .2s;
    }

    .search-bar:focus-within {
      border-color: #1db954;
    }

    .search-bar input {
      flex: 1;
      min-width: 0;
      padding: .55rem 0;
      font-size: 1rem;
      border: none;
      background: transparent;
      color: #eee;
      outline: none;
    }

    .search-bar input::placeholder { color: #444; }

    .search-bar button {
      padding: .6rem 1.2rem;
      font-size: .95rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      background: #1db954;
      color: #fff;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: background .15s;
    }

    .search-bar button:active { background: #17a349; }

    #results {
      width: 100%;
      max-width: 580px;
      margin-top: 1.5rem;
    }

    #message {
      text-align: center;
      color: #444;
      font-size: .95rem;
      margin-top: 2rem;
    }

    .card {
      display: flex;
      align-items: center;
      gap: 1rem;
      background: #141414;
      border: 1px solid #1f1f1f;
      padding: .85rem;
      border-radius: 12px;
      margin-bottom: .6rem;
      transition: border-color .2s;
    }

    .card:hover { border-color: #2a2a2a; }

    .card img {
      width: 52px;
      height: 52px;
      min-width: 52px;
      object-fit: cover;
      border-radius: 8px;
      background: #1f1f1f;
    }

    .info {
      flex: 1;
      min-width: 0;
    }

    .info .title {
      font-weight: 600;
      font-size: .92rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #f0f0f0;
    }

    .info .dur {
      font-size: .78rem;
      color: #555;
      margin-top: .25rem;
    }

    .info .status {
      font-size: .78rem;
      color: #1db954;
      margin-top: .25rem;
      min-height: 1em;
    }

    .dl-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 38px;
      height: 38px;
      min-width: 38px;
      border: none;
      border-radius: 50%;
      background: #1db954;
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: background .15s, transform .1s;
    }

    .dl-btn:not(:disabled):active {
      background: #17a349;
      transform: scale(.93);
    }

    .dl-btn:disabled {
      background: #1f1f1f;
      color: #444;
      cursor: default;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: .3rem;
      margin-top: .35rem;
    }

    .tag {
      font-size: .72rem;
      color: #888;
      background: #1f1f1f;
      border-radius: 4px;
      padding: .15rem .45rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 160px;
    }
  </style>
</head>
<body>

  <header>
    <h1>🎵 Song Downloader</h1>
    <p>Search any song and download it as MP3</p>
  </header>

  <div class="search-wrap">
    <div class="search-bar">
      <input id="q" type="search" placeholder="Artist, song, album..."
             onkeydown="if(event.key==='Enter')doSearch()" autocomplete="off">
      <button onclick="doSearch()">Search</button>
    </div>
  </div>

  <div id="results"></div>

  <script>
    async function doSearch() {
      const q = document.getElementById('q').value.trim();
      if (!q) return;
      document.getElementById('results').innerHTML = '<p id="message">Searching...</p>';
      const res = await fetch('/search?q=' + encodeURIComponent(q));
      const data = await res.json();
      if (!data.length) {
        document.getElementById('results').innerHTML = '<p id="message">No results found.</p>';
        return;
      }
      document.getElementById('results').innerHTML = data.map(song => {
      const views = formatViews(song.views);
      const channel = song.channel || '';
      // const album = song.album ? `💿 ${song.album}` : '';

      const tags = [channel, views].filter(Boolean).map(t =>
        `<span class="tag">${t}</span>`
      ).join('');

      return `
        <div class="card">
          <img src="${song.thumbnail}" alt="" loading="lazy">
          <div class="info">
            <div class="title" title="${song.title}">${song.title}</div>
            <div class="dur">${song.duration}</div>
            <div class="meta">${tags}</div>
            <div class="status" id="status-${song.id}"></div>
          </div>
          <button class="dl-btn" onclick="startDownload('${song.id}', '${song.url}', this)" title="Download">⬇</button>
        </div>`;
    }).join('');
  }
    async function startDownload(id, url, btn) {
      btn.disabled = true;
      btn.textContent = '…';
      document.getElementById('status-' + id).textContent = 'Queued';
      await fetch('/download', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id, url })
      });
      pollStatus(id, btn);
    }
    function formatViews(v) {
      if (!v) return '';
      if (v >= 1_000_000_000) return (v / 1_000_000_000).toFixed(1).replace(/\.0$/, '') + 'B views';
      if (v >= 1_000_000)     return (v / 1_000_000).toFixed(1).replace(/\.0$/, '') + 'M views';
      if (v >= 1_000)         return (v / 1_000).toFixed(1).replace(/\.0$/, '') + 'K views';
      return v + ' views';
    }
    function pollStatus(id, btn) {
      const interval = setInterval(async () => {
        const res = await fetch('/status/' + id);
        const data = await res.json();
        const el = document.getElementById('status-' + id);
        if (!el) { clearInterval(interval); return; }
        if (data.state === 'downloading') {
          el.textContent = '⬇ ' + data.progress;
        } else if (data.state === 'converting') {
          el.textContent = '⚙ Converting...';
        } else if (data.state === 'done') {
          el.textContent = '✅ Done!';
          btn.textContent = '✓';
          clearInterval(interval);
          window.location.href = '/files/' + id;  // use id, not data.filename
        }
      }, 1000);
    }
  </script>
</body>
</html>
